<!-- Carrega os estilos internos do THF uma única vez para os campos dinâmicos. -->
<thf-lookup hidden t-field-label="hidden" aria-hidden="true" tabindex="-1" />

<div class="left">
    <po-button
        class="po-mb-2"
        p-label="Trocar tema"
        (p-click)="toogleTheme()"
    />

    <po-radio-group
        [(ngModel)]="radioValue"
        [p-options]="radioOptions"
        (ngModelChange)="onRadioChange($event)"
    ></po-radio-group>

    <po-number class="po-mb-2" p-label="MaxLength" [(ngModel)]="maxlength"></po-number>

    <form [formGroup]="formTest">
        <dynamic-field-value-picker
            formControlName="lookup1"
            label="Lookup Single String"
            [loading]="radioValue === 'loading'"
            [readonly]="radioValue === 'readonly'"
            [clean]="radioValue === 'clean'"
            [maxlength]="maxlength"
            [multiValue]="false"
            [type]="'string'"
            [serviceUrl]="serviceUrlStr"
            [selectionMode]="'lookup'"
        />
        <dynamic-field-value-picker
            formControlName="lookup2"
            [type]="'number'"
            label="Lookup Multi String"
            [loading]="radioValue === 'loading'"
            [readonly]="radioValue === 'readonly'"
            [clean]="radioValue === 'clean'"
            [maxlength]="maxlength"
            [multiValue]="true"
            [serviceUrl]="serviceUrl"
            [selectionMode]="'lookup'"
        />
        <dynamic-field-value-picker
            formControlName="lookup4"
            label="Manual Multi Number"
            [loading]="radioValue === 'loading'"
            [readonly]="radioValue === 'readonly'"
            [clean]="radioValue === 'clean'"
            [maxlength]="maxlength"
            [multiValue]="true"
            [type]="'number'"
            [selectionMode]="'manual'"
        />
    </form>

            [t-readonly]="radioValue === 'readonly'"

            [t-filter-search-select]="filterSelect"
        ></thf-lookup>
    </form> -->
</div>

<div class="right">
    <pre>{{formTest.getRawValue() | json}}</pre>
</div>
