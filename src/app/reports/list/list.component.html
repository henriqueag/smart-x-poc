<po-page-default
    p-title="Listagem de recursos"
    [p-actions]="pageActions"
>
    @if (pageButtonEl(); as buttonTarget) {
        <po-popup
            [p-actions]="popupActions"
            [p-hide-arrow]="true"
            [p-target]="buttonTarget"
        />
    }

    <po-input
        class="thf-grid-toolbar-input"
        name="search-input"
        p-labe="Buscar na tabela"
        p-icon="ICON_SEARCH"
        p-placeholder="Buscar na tabela"
        [hidden]="true"
        [formControl]="searchControl"
    />

    <thf-grid
        [t-columns]="columns"
        [t-items]="gridItems()"
        [t-action-delete]="true"
        [t-action-edit]="onGridEdit.bind(this)"
        [t-selectable]="true"
        [t-single-select]="true"
        [t-actions-right]="true"
        [t-custom-actions]="customActions"
        [t-draggable]="true"
        [t-fields]="filterFields"
        [t-actions]="rowActions"
        [t-groupable]="true"
        [t-page-size]="20"
        [t-pageable]="true"
        [t-resizable]="true"
        [t-sort]="sortColumns"
        [t-container]="false"
        [t-options-paging]="optionsPaging"
        [t-auto-size]="false"
        [t-show-more-disabled]="!hasMoreItems()"
        [t-selectable-entire-line]="false"
        [t-show-draggable-icon]="false"
        [t-actions-filter]="true"
        [t-literals]="gridLiterals"
        (t-delete-item)="onGridDeleteItem($event)"
        (t-change-group)="onGridChangeGroup($event)"
        (t-change-order-column)="onGridChangeOrderColumn($event)"
        (t-show-more)="onGridShowMore($event)"
        (t-change-sort-column)="onGridChangeSortColumn($event)"
        (t-change-page-size)="onGridChangePageSize($event)"
        (t-change-visible-columns)="onGridChangeVisibleColumns($event)"
        (t-change-order-column)="onGridChangeOrderColumn($event)"
        (t-restore-column-manager)="onGridRestoreColumnManager($event)"
        (t-change-filter-by-column)="onGridChangeFilterByColumn($event)"
        (t-change-fixed-columns)="onGridChangeFixedColumns($event)"
        (t-custom-filter)="onGridCustomFilter($event)"
        (t-change-options-column-manager)="onGridChangeOptionsColumnManager($event)"
        (t-selected)="selectedRowId.set($event.id)"
        (t-unselected)="selectedRowId.set(null)"
    >
        <ng-template
            t-grid-cell-template
            let-column="column"
            let-row="row"
        >
            @if (column.property === 'tags') {
                <div
                    style="
                        flex: 1;
                        padding-inline: var(--spacing-xxs);
                        min-height: 24px;
                    "
                >
                    @if (selectedRowId() === row.id && isTagEditing()) {
                        <app-tag-selector
                            [tags]="tags()"
                            [(ngModel)]="row.tags[0]"
                            (update)="onUpdateTags($event)"
                            (complete)="isTagEditing.set(false)"
                        />
                    } @else {
                        <div (click)="onStartTagEdit(row)">{{ row.tags.join(', ') }}</div>
                    }
                </div>
            }
        </ng-template>
    </thf-grid>
</po-page-default>

<po-modal
    #filterModal
    p-title="Filtro avançado"
    p-size="md"
    [p-primary-action]="filterModalPrimaryAction"
    [p-secondary-action]="filterModalSecondaryAction"
>
    <section class="advanced-filter-body">
        <po-divider p-label="Nível de acesso"></po-divider>

        <po-select
            name="accessType"
            [p-options]="accessTypeOptions"
            [(ngModel)]="advancedFilter.accessType"
        ></po-select>

        <po-divider p-label="Filtro de propriedades"></po-divider>

        <po-input
            name="filterDescription"
            p-label="Descrição"
            p-placeholder="Descrição do recurso"
            [(ngModel)]="advancedFilter.description"
        ></po-input>

        <po-radio-group
            name="filterFavorite"
            p-label="Favorito"
            [p-columns]="3"
            [p-options]="favoriteFilterOptions"
            [(ngModel)]="advancedFilter.favorite"
        ></po-radio-group>

        <po-checkbox-group
            name="filterTypes"
            p-label="Tipo"
            [p-columns]="3"
            [p-options]="resourceTypeOptions"
            [(ngModel)]="advancedFilter.types"
        ></po-checkbox-group>

        <po-multiselect
            name="filterTags"
            p-label="Tags"
            [p-options]="tagCatalog"
            [(ngModel)]="advancedFilter.tags"
        ></po-multiselect>
    </section>
</po-modal>
